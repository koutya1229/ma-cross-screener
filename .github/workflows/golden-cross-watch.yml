name: Golden Cross Watch

on:
  schedule:
    # 18:00 JST = 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas numpy matplotlib

      - name: Run screener
        run: python ma_cross_screener.py

      - name: Generate report
        run: python generate_report.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 32銘柄のEMA10/20クロス通知は一時停止中（SOXL通知のみ運用）。
      # 再開するには下の2ステップのコメントを外す。
      # - name: Notify on signal (golden cross / high-confidence dead cross)
      #   env:
      #     NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      #   run: python notify_signals.py

      - name: Run SOXL 4-signal watch (golden cross / 200d reclaim / RSI recovery / in-trend MACD cross)
        run: python soxl_signal_watch.py

      - name: Notify on SOXL signal
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify_soxl_signals.py

      - name: Run 1458 signal watch (buy signals)
        run: python 1458_signal_watch.py

      - name: Notify on 1458 signal
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify_1458_signals.py

      - name: Run 1459 short signal watch (sell/short signals)
        run: python 1459_short_signal_watch.py

      - name: Notify on 1459 short signal
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify_1459_short_signals.py

      # 32銘柄の週次サマリー通知も一時停止中。
      # - name: Weekly digest (Mondays only)
      #   env:
      #     NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      #   run: python weekly_digest.py

      - name: Commit signal track record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signal_track_record.json
          git diff --staged --quiet || git commit -m "Update signal track record"
          git push

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
