name: Golden Cross Watch

on:
  schedule:
    # 08:00 JST = 23:00 UTC(前日)
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run screener
        run: python ma_cross_screener.py

      - name: Notify on golden cross
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify_golden_cross.py
