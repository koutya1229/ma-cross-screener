name: Golden Cross Watch

on:
  schedule:
    # 08:00 JST = 23:00 UTC(前日)
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas numpy matplotlib

      - name: Run screener
        run: python ma_cross_screener.py

      - name: Generate report
        run: python generate_report.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Notify on signal (golden cross / high-confidence dead cross)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify_signals.py

      - name: Weekly digest (Mondays only)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python weekly_digest.py

      - name: Commit signal track record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signal_track_record.json
          git diff --staged --quiet || git commit -m "Update signal track record"
          git push

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
